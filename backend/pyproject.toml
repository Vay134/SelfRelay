[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "e2e-secure-file-transfer-backend"
version = "0.1.0"
description = "FastAPI control-plane scaffold for the E2E Secure File Transfer System."
requires-python = ">=3.12,<3.15"
dependencies = [
    "asyncpg==0.30.0",
    "cryptography==45.0.7",
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.12.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
