name: Database tests

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    database:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Supabase CLI
              uses: supabase/setup-cli@v1
              with:
                  version: 2.116.0

            - name: Start local Supabase
              run: supabase start

            - name: Apply migrations to a clean database
              run: supabase db reset --local --no-seed

            - name: Verify migration history
              run: supabase migration list --local

            - name: Run database privilege and schema tests
              run: supabase test db --local
